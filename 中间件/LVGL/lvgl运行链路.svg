<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430">
  <style>
    .title { font: 700 26px 'Microsoft YaHei', sans-serif; fill: #17324d; }
    .label { font: 600 17px 'Microsoft YaHei', sans-serif; fill: #17324d; }
    .small { font: 14px 'Microsoft YaHei', sans-serif; fill: #3a506b; }
    .box { stroke: #4c6a85; stroke-width: 2; rx: 12; }
    .arrow { stroke: #4c6a85; stroke-width: 3; fill: none; marker-end: url(#arrow); }
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#4c6a85"/></marker></defs>
  <rect width="1100" height="430" fill="#f7fafc"/><text x="40" y="48" class="title">LVGL v9 · FreeRTOS 运行链路</text>
  <rect x="40" y="130" width="170" height="120" class="box" fill="#e8f1fb"/><text x="62" y="170" class="label">HAL_Init</text>
  <text x="62" y="200" class="small">SysTick 开始计时</text><text x="62" y="226" class="small">HAL_GetTick 可用</text>
  <rect x="270" y="130" width="170" height="120" class="box" fill="#e9f7ef"/><text x="292" y="170" class="label">lv_init</text>
  <text x="292" y="200" class="small">创建 display</text><text x="292" y="226" class="small">绑定 FreeRTOS OSAL</text>
  <rect x="500" y="130" width="170" height="120" class="box" fill="#fff4df"/><text x="522" y="170" class="label">lvgl_task</text>
  <text x="522" y="200" class="small">每 5 ms 调度</text><text x="522" y="226" class="small">lv_timer_handler</text>
  <rect x="730" y="130" width="170" height="120" class="box" fill="#f1eafe"/><text x="752" y="170" class="label">flush_cb</text>
  <text x="752" y="200" class="small">RGB565 区域复制</text><text x="752" y="226" class="small">flush_ready</text>
  <rect x="960" y="130" width="100" height="120" class="box" fill="#fdebec"/><text x="975" y="170" class="label">LCD</text>
  <text x="975" y="200" class="small">当前为</text><text x="975" y="226" class="small">虚拟 FB</text>
  <path d="M210 190 L270 190" class="arrow"/><path d="M440 190 L500 190" class="arrow"/><path d="M670 190 L730 190" class="arrow"/><path d="M900 190 L960 190" class="arrow"/>
  <path d="M585 250 C585 340, 125 340, 125 250" class="arrow"/>
  <text x="360" y="375" class="small">FreeRTOS 调度器与 HAL Tick 共同维持 LVGL 时间和任务节拍</text>
</svg>
